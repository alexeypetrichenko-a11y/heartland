<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heartland Interface Mockup</title>
<style>
:root{--bg:#0E1620;--surf:#16222F;--surf2:#1D2D3E;--line:#2A3B4E;--text:#EAE6DA;--muted:#A9B8C7;--acc:#E3B15C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
h1{margin:2px 0 0;font-family:"Space Grotesk",system-ui,sans-serif;font-size:28px;line-height:1.1}
.chip{height:36px;padding:0 12px;border:1px dashed #5B6F84;border-radius:18px;display:flex;align-items:center;font-size:13px;color:var(--muted)}
.hr{display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surf);display:flex;align-items:center;justify-content:center;padding:0}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.mapwrap{margin:0 16px;background:#0A1119;border:1px solid var(--line);border-radius:20px;overflow:hidden;flex:none}
.mapwrap svg{display:block;width:100%}
polygon{cursor:pointer;transition:fill .15s}
.sheet{margin-top:14px;flex:1;min-height:0;background:var(--surf);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.chips{display:flex;gap:8px}
.chips button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);font-weight:600;font-size:15px;padding:0}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#1A1409}
.sheet h2{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;font-size:20px}
.sub{font-size:14px;color:var(--muted)}
.short{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.short button{min-height:76px;border-radius:16px;border:1px solid var(--line);background:var(--surf2);padding:10px 8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.short span:first-child{font-size:13px;color:var(--muted)}
.dash{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:22px}
.list{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.tile span:first-child{font-size:13px;color:var(--muted)}
.tile .dash{font-size:26px;color:var(--acc)}
.grp h3{margin:0 0 8px 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{width:100%;min-height:56px;padding:8px 14px;display:flex;align-items:center;gap:12px;background:transparent;border:0;border-top:1px solid #243446;text-align:left}
.row:first-child{border-top:0}
.dot{width:34px;height:34px;flex:none;border-radius:17px;border:1px dashed #5B6F84}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt b{font-size:15px;font-weight:500}.rt i{font-style:normal;font-size:13px;color:var(--muted)}
.val{font-size:15px;color:var(--acc);font-weight:600}
nav{flex:none;background:#101B27;border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex}
nav button{flex:1;height:56px;border:0;background:transparent;color:#9FB0C0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:11px;font-weight:600}
nav button.on{color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="brand">Heartland</div><h1 id="title">World</h1></div>
    <div class="hr"><div class="chip">[Date / turn]</div>
      <button class="icon-btn" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
  </header>
  <main id="main"></main>
  <nav id="nav" aria-label="Main"></nav>
</div>
<script>
const tabs=[
 {id:'world',label:'World',icon:'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18Z M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18'},
 {id:'politics',label:'Politics',icon:'M3 9l9-5 9 5 M5 10v8 M9.5 10v8 M14.5 10v8 M19 10v8 M3 20h18'},
 {id:'economy',label:'Economy',icon:'M5 20V11 M12 20V5 M19 20v-7 M3 20h18'},
 {id:'diplomacy',label:'Diplomacy',icon:'M9 7.5a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9Z M15 7.5a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9Z'},
 {id:'military',label:'Military',icon:'M12 3l7 3v5c0 4.5-3 8-7 10c-4-2-7-5.5-7-10V6l7-3Z'}];
const geo=[
 ['A','20,40 120,20 150,80 110,130 40,120',76,78],['B','130,24 230,30 250,90 190,110 160,84',192,68],
 ['C','246,34 338,50 330,120 270,130 258,92',296,88],['D','30,140 112,140 140,205 90,265 24,225',78,200],
 ['E','124,130 200,124 236,172 200,232 152,208',176,176],['F','216,138 300,138 336,200 282,270 226,232 246,182',276,202]];
const r=(t,s)=>({title:t,sub:s});
const content={
 politics:{tiles:[],groups:[['Domestic',[r('Government','[Leadership and system]'),r('Factions','[Groups and support]'),r('Public mood','[Overall sentiment]')]],['Decisions',[r('Pending decisions','[Needs your attention]')]]]},
 economy:{tiles:['Output','Budget','Trade','Resources'],groups:[['Trade partners',[1,2,3].map(()=>r('[Country name]','[Main exchange]'))]]},
 diplomacy:{tiles:[],groups:[['Relations',[1,2,3,4].map(()=>r('[Country name]','[Relationship status]'))],['Incoming',[r('Proposals and messages','[From other countries]')]]]},
 military:{tiles:[],groups:[['Forces',[r('Armed forces','[Overview]'),r('Readiness','[Current state]')]],['Operations',[1,2].map(()=>r('[Theatre or conflict]','[Status]'))]]}};
let tab='world',region='A';
const $=id=>document.getElementById(id);
function render(){
 $('title').textContent=tabs.find(t=>t.id===tab).label;
 $('nav').innerHTML=tabs.map(t=>`<button data-t="${t.id}" class="${t.id===tab?'on':''}" ${t.id===tab?'aria-current="page"':''}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${t.icon}"/></svg>${t.label}</button>`).join('');
 const m=$('main');
 if(tab==='world'){
  m.innerHTML=`<div class="mapwrap"><svg viewBox="0 0 358 290" role="img" aria-label="Abstract map with six placeholder territories">
   <path d="M0 48H358M0 96H358M0 144H358M0 192H358M0 240H358M60 0V290M120 0V290M180 0V290M240 0V290M300 0V290" stroke="#16222F"/>
   ${geo.map(g=>`<polygon data-r="${g[0]}" points="${g[1]}" fill="${g[0]===region?'#C99A4A':'#24384C'}" stroke="${g[0]===region?'#F1D08F':'#4A6178'}" stroke-width="${g[0]===region?2.5:1.5}" stroke-linejoin="round"/>`).join('')}
   ${geo.map(g=>`<text x="${g[2]}" y="${g[3]}" text-anchor="middle" font-size="15" font-weight="600" fill="#EAE6DA" pointer-events="none">${g[0]}</text>`).join('')}
  </svg></div>
  <div class="sheet"><div class="chips">${geo.map(g=>`<button data-r="${g[0]}" aria-label="Select territory ${g[0]}" class="${g[0]===region?'on':''}">${g[0]}</button>`).join('')}</div>
   <div><h2>Territory ${region}</h2><div class="sub">Controlled by [Country name]</div></div>
   <div class="short">${['politics','economy','military'].map(id=>`<button data-t="${id}"><span>${tabs.find(t=>t.id===id).label}</span><span class="dash">—</span></button>`).join('')}</div></div>`;
 } else {
  const c=content[tab];
  m.innerHTML=`<div class="list">${c.tiles.length?`<div class="tiles">${c.tiles.map(t=>`<div class="tile"><span>${t}</span><span class="dash">—</span></div>`).join('')}</div>`:''}
  ${c.groups.map(([h,rows])=>`<div class="grp"><h3>${h}</h3><div class="card">${rows.map(x=>`<button class="row"><span class="dot"></span><span class="rt"><b>${x.title}</b><i>${x.sub}</i></span><span class="val">—</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B8C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`).join('')}</div></div>`).join('')}</div>`;
 }
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]'); if(t){tab=t.dataset.t;render();return}
 const g=e.target.closest('[data-r]'); if(g){region=g.dataset.r;render()}
});
render();
</script>
</body>
</html>
